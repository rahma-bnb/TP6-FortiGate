name: Firewall-as-Code

on:
  pull_request:
    paths:
      - 'firewall/**'

  push:
    branches:
      - main
    paths:
      - 'firewall/**'

jobs:

  lint-and-test:

    runs-on: self-hosted

    steps:

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Lint
        run: python scripts/lint_rules.py

      - name: Tests
        run: python scripts/test_rules.py

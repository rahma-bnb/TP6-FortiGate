name: Firewall-as-Code

on:
  pull_request:
    paths:
      - 'firewall/**'

  push:
    branches:
      - main
    paths:
      - 'firewall/**'

jobs:

  lint-and-test:

    runs-on: self-hosted

    steps:

      - uses: actions/checkout@v4

      - run: pip install pyyaml requests

      - run: python scripts/lint_rules.py

      - run: python scripts/test_rules.py

  deploy:

    needs: lint-and-test

    if: github.ref == 'refs/heads/main'

    runs-on: self-hosted

    steps:

      - uses: actions/checkout@v4

      - run: pip install pyyaml requests

      - run: python scripts/deploy_rules.py
        env:
          FORTIGATE_TOKEN: ${{ secrets.FORTIGATE_TOKEN }}
